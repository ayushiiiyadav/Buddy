<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Buddy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- React will render Buddy's whole app inside this empty div -->
  <div id="root"></div>

  <!-- React + ReactDOM only — NO Babel needed anymore -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- plain script tag, no type="text/babel" -->
  <!-- ?v=2 forces the browser to treat this as a NEW file, bypassing any cached old version -->
  <script src="app.js?v=7"></script>

</body>
</html>
